name: Umalog
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
targets:
  Umalog:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.umalog.racing
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: うまログ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
    dependencies:
      - target: RaceWidget
        embed: true
  RaceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - path: ../widget/graded-races.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.umalog.racing.RaceWidget
        INFOPLIST_FILE: Widget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  UmalogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Widget/CalendarModel.swift
      - path: Widget/MonthIntent.swift
      - path: ../widget/graded-races.json
        buildPhase: resources
    dependencies:
      - target: Umalog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.umalog.racing.tests
schemes:
  Umalog:
    build:
      targets:
        Umalog: all
    test:
      targets:
        - UmalogTests
