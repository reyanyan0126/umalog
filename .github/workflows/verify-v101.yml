name: Umalog development verification

on:
  push:
    branches:
      - work/v1.0.1-results
      - work/v1.0.2-ios-picker
      - work/v1.1.0-style
      - work/v1.1-calendar-2026-2027
      - work/v1.1.0-dev3-ui-graded-races
      - work/v1.1.0-dev4-ledger-calendar
      - work/v1.2-ui-redesign
      - work/v1.2.0-dev2-calendar-home
      - work/v1.2.0-dev3-ledger-focus
      - work/v1.2.0-dev4-compact-ledger-grades
      - work/v1.2.0-dev5-home-dock-tips
      - work/v1.2.0-dev6-jra-style-entry
    paths:
      - '.github/workflows/verify-v101.yml'
      - '**/*.js'
      - 'tests/**'
      - 'publish/**'
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'PROGRESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, browser and PWA upgrade regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and publish consistency
        run: python tools/check_publish.py
      - name: Core, result-state and tips tests
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check development root browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/ node tests/browser.cjs
      - name: Check packaged PWA browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/publish/ node tests/browser.cjs
      - name: Prepare portable browser adapter
        run: |
          cat > tests/ci-chromium.cjs <<'EOF'
          module.exports = {
            executablePath: async () => require('playwright').chromium.executablePath(),
            args: []
          };
          EOF
      - name: 'Old dev.5 to development: preserve IndexedDB and offline behavior'
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/update.cjs
      - name: Fresh session update protects unsaved edits
        run: FIRST_SESSION=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/update.cjs
      - name: Calendar and nursery source browser checks
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/features.cjs
      - name: Calendar and nursery publish browser checks
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/features.cjs
      - name: Graded race and dev3 UI source checks
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/dev3.cjs
      - name: Graded race and dev3 UI publish checks
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/dev3.cjs
      - name: Ledger calendar source browser checks
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/ledger-ui.cjs
      - name: Ledger calendar publish browser checks
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/ledger-ui.cjs
      - name: V12 navigation and responsive UI source checks
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/ui-v12.cjs
      - name: V12 navigation and responsive UI publish checks
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/ui-v12.cjs
