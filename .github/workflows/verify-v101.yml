      - work/v1.2.0-dev10-entry-quick-review
      - work/v1.2.0-dev11-postrace-ledger
      - work/v1.2.0-dev14-daily-analysis-rewards
      - work/v1.2.0-dev15-fast-entry-sheets
      - work/v1.2.0-dev18-corrections-budget-polish
      - work/v1.3.0-rc1-draft-recovery-data-safety
      - work/v1.3.0-dev30-screen-roles-simplify-home
      - work/v1.3.0-stable-dev31-36
      - work/v1.3.1-dev37-40-ux-safety
      - work/v1.3.2-backup-freshness
      - work/v1.4.0-smart-entry
      - work/v1.5.0-period-comparison
      - work/v1.6.0-living-companion
      - work/v1.6.1-companion-animation-outfits
      - work/v1.7.0-manual-race-info
      - work/v1.7.1-race-corrections
      - work/v1.8.0-race-audit
      - work/v1.8.1-formation-stakes
      - work/v2.0.0-release
      - work/v2.1.0-flexible-ledger
      - work/v2.2.0-dev1-quick-repeat
      - work/v2.2.0-dev2-history-search
      - work/v2.2.0-dev3-entry-flow
      - work/v2.2.0-dev4-iphone-keyboard
      - work/v2.2.0-stable-release
      - work/v2.3.0-dev1-inclusive-analytics
      - work/v2.3.0-dev2-category-ranking
      - work/v2.3.0-ux1-simple-home-calendar
      - work/v2.3.0-ux2-quick-entry-simplify
      - work/v2.3.0-ux3-unified-history
      - work/v2.3.0-ux4-basic-analysis
    paths:
      - '.github/workflows/verify-v101.yml'
      - '**/*.js'
      - 'tests/**'
      - 'publish/**'
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'PROGRESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, browser and PWA upgrade regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and publish consistency
        run: python tools/check_publish.py
      - name: Check ESM syntax in source and publish
        run: |
          for name in app.js entry-results.js fast-results.js entry-sheets.js ledger-tools.js line-correction.js core.js db.js advanced-picker.js entry-drafts.js screen-roles.js ledger-calendar.js ledger-trends.js growth-companion.js; do node --check "$name"; node --check "publish/$name"; done
          node --check analysis-compare.js; node --check publish/analysis-compare.js; node --check app.js; node --check publish/app.js; node --check manual-race.js; node --check publish/manual-race.js; node --check manual-race-correction.js; node --check publish/manual-race-correction.js; node --check race-audit.js; node --check publish/race-audit.js; node --check stake-allocation.js; node --check publish/stake-allocation.js; node --check stake-workflow.js; node --check publish/stake-workflow.js; node --check simple-ledger.js; node --check publish/simple-ledger.js; node --check analysis-quality.js; node --check publish/analysis-quality.js; node --check category-compare.js; node --check publish/category-compare.js;
      - name: Core, result-state and tips tests
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check development root browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/ node tests/browser.cjs
      - name: Check packaged PWA browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/publish/ node tests/browser.cjs
      - name: Prepare portable browser adapter
        run: |
          cat > tests/ci-chromium.cjs <<'EOF'
          module.exports = {
            executablePath: async () => require('playwright').chromium.executablePath(),
            args: []
          };
          EOF

      - name: v2.1.0 simple accounting source
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/v210.cjs
      - name: v2.1.0 simple accounting publish
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/v210.cjs

      - name: simplified quick record source
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-quick.cjs
      - name: simplified quick record publish
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-quick.cjs

      - name: basic-first analysis source
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-analysis.cjs
      - name: basic-first analysis publish
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-analysis.cjs

      - name: chronological mixed history source
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-history.cjs
      - name: chronological mixed history publish
        run: PUBLISH=1 CHROMIUM_MODULE=./ci-chromium.cjs node tests/ux-history.cjs

      - name: simplified home and embedded calendar source
