permissions:
  contents: read

jobs:
  verify:
    name: Unit, browser and PWA upgrade regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and publish consistency
        run: python tools/check_publish.py
      - name: Check ESM syntax in source and publish
        run: |
          for name in app.js entry-results.js fast-results.js entry-sheets.js ledger-tools.js line-correction.js core.js db.js advanced-picker.js entry-drafts.js screen-roles.js ledger-calendar.js ledger-trends.js growth-companion.js; do node --check "$name"; node --check "publish/$name"; done
          node --check analysis-compare.js; node --check publish/analysis-compare.js; node --check app.js; node --check publish/app.js; node --check manual-race.js; node --check publish/manual-race.js; node --check manual-race-correction.js; node --check publish/manual-race-correction.js; node --check race-audit.js; node --check publish/race-audit.js; node --check stake-allocation.js; node --check publish/stake-allocation.js; node --check stake-workflow.js; node --check publish/stake-workflow.js; node --check simple-ledger.js; node --check publish/simple-ledger.js; node --check analysis-quality.js; node --check publish/analysis-quality.js; node --check category-compare.js; node --check publish/category-compare.js;
      - name: Core, result-state and tips tests
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check development root browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/ node tests/browser.cjs || { echo "browser.cjs -- TEST_URL=http://127.0.0.1:8000/umalog/ node tests/browser.cjs" >> "$RUNNER_TEMP/umalog-failed-tests"; }
      - name: Check packaged PWA browser scenarios
        run: TEST_URL=http://127.0.0.1:8000/umalog/publish/ node tests/browser.cjs || { echo "browser.cjs -- TEST_URL=http://127.0.0.1:8000/umalog/publish/ node tests/browser.cjs" >> "$RUNNER_TEMP/umalog-failed-tests"; }
      - name: Prepare portable browser adapter
        run: |
          cat > tests/ci-chromium.cjs <<'EOF'
          module.exports = {
            executablePath: async () => require('playwright').chromium.executablePath(),
            args: []
          };
          EOF

      - name: v2.1.0 simple accounting source
        run: CHROMIUM_MODULE=./ci-chromium.cjs node tests/v210.cjs || { echo "v210.cjs -- CHROMIUM_MODULE=./ci-chromium.cjs node tests/v210.cjs" >> "$RUNNER_TEMP/umalog-failed-tests"; }
      - name: v2.1.0 simple accounting publish
