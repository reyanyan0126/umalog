name: Regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v4.5.8-backup-preview]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax and unit tests
        run: npm test
