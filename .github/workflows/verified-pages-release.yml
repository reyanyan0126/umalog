name: Verified GitHub Pages release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-pages
  cancel-in-progress: false
jobs:
  pages-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getPages(context.repo);
            core.info(JSON.stringify({build_type:data.build_type,source:data.source}));
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_publish.py
      - run: npm test
  acceptance:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_publish.py && npm test
      - run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          cat > tests/ci-chromium.cjs <<'EOF'
          module.exports={executablePath:async()=>require('playwright').chromium.executablePath(),args:[]};
          EOF
      - name: Atomic IndexedDB and backup acceptance (Chromium and WebKit)
        run: |
          node tests/data-protection.cjs
          BROWSER=webkit node tests/data-protection.cjs
      - name: Browser startup and PWA smoke
        run: |
          node tests/startup-smoke.cjs
          PUBLISH=1 node tests/startup-smoke.cjs
          BROWSER=webkit node tests/startup-smoke.cjs
          PUBLISH=1 BROWSER=webkit node tests/startup-smoke.cjs
      - name: Offline PWA reopen (Chromium and WebKit)
        run: |
          node tests/offline-pwa.cjs
          PUBLISH=1 node tests/offline-pwa.cjs
          BROWSER=webkit node tests/offline-pwa.cjs
          PUBLISH=1 BROWSER=webkit node tests/offline-pwa.cjs
      - name: Ledger, navigation and backup acceptance
        env:
          CHROMIUM_MODULE: ./ci-chromium.cjs
        run: |
          node tests/ux-v250.cjs
          PUBLISH=1 node tests/ux-v250.cjs
          node tests/navigation-e2e.cjs
          PUBLISH=1 node tests/navigation-e2e.cjs
          node tests/ai-import-browser.cjs
          PUBLISH=1 node tests/ai-import-browser.cjs
      - name: UI and data compatibility
        env:
          CHROMIUM_MODULE: ./ci-chromium.cjs
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" worktree add "$RUNNER_TEMP/umalog-v280" c41a979a2013925d320269baf9663cdcabd112cb
          BASELINE_DIR="$RUNNER_TEMP/umalog-v280" OUTPUT_DIR="$RUNNER_TEMP/umalog-comparison" node tests/refactor-browser.cjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [quality, acceptance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject branch publishing that bypasses tests
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getPages(context.repo);
            core.info(JSON.stringify({build_type:data.build_type,source:data.source}));
            if (data.build_type !== 'workflow') core.setFailed('Pages Source must be GitHub Actions before releasing.');
      - name: Stamp tested commit
        run: node -e "require('fs').writeFileSync('build.json', JSON.stringify({commit:process.env.GITHUB_SHA}))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed commit and JavaScript bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/verify-deployment.cjs
