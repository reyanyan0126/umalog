<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="うまログ — 日付と金額から簡単に記録できる競馬収支アプリ"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/logo-official.png"><link rel="icon" type="image/png" href="./assets/logo-official.png"><link rel="stylesheet" href="./style.css"><title>うまログ（仮）</title></head><body><section id="launchScreen" class="launch-screen" aria-label="うまログ タイトル画面"><div class="launch-content"><img class="launch-logo" src="./assets/logo-official.png" alt="うまログ（仮）"><a id="launchStart" class="launch-start" href="#home" onclick="document.getElementById('launchScreen').hidden=true;document.getElementById('launchScreen').style.display='none';">はじめる</a><button id="launchUpdate" class="launch-update" type="button">最新アップデートを確認</button><p id="launchUpdateStatus" class="launch-update-status" role="status" aria-live="polite"></p></div></section><header id="home"><a href="#home" class="brand" aria-label="うまログ（仮） ホーム"><img src="./assets/logo-official.png" alt="うまログ（仮）" width="76" height="57" style="display:block;width:76px;height:57px;object-fit:contain"></a><button id="settingsButton" class="quiet" aria-label="設定とバックアップ">設定</button></header><div id="update" hidden></div><main id="app"><p>記録を読み込んでいます…</p></main><nav aria-label="メインナビゲーション"><a href="#home"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-8h6v8"/></svg><span>ホーム</span></a><a href="#quick"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="M4 4h16a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 1 2-2Z"/><path d="M12 8v8M8 12h8"/></svg><span>記録</span></a><a href="#history"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h4"/></svg><span>履歴</span></a><a href="#analysis"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="M3 20h18M6 17v-5M11 17V7M16 17v-8M21 17V4"/></svg><span>分析</span></a></nav><div id="notice" role="status" aria-live="polite"></div><noscript>JavaScriptを有効にしてください。</noscript><script>
(function(){const splash=document.getElementById("launchScreen"),start=document.getElementById("launchStart");function close(){splash.hidden=true;try{sessionStorage.setItem("umalog-title-seen","1")}catch(e){}}try{if(sessionStorage.getItem("umalog-title-seen")==="1")close()}catch(e){}start.addEventListener("click",close);if(location.hash&&location.hash!=="#home")close();})();
</script><script>
(function(){
 const button=document.getElementById('launchUpdate');
 const status=document.getElementById('launchUpdateStatus');
 button.addEventListener('click',async()=>{
  button.disabled=true;
  status.textContent='更新を確認しています…';
  try{
   if(!('serviceWorker' in navigator)){status.textContent='更新機能に対応していません。';return;}
   const reg=await navigator.serviceWorker.getRegistration('./')||await navigator.serviceWorker.register('./sw.js',{scope:'./'});
   await reg.update();
   if(reg.installing){await new Promise(resolve=>{const worker=reg.installing;const finish=()=>{if(worker.state==='installed'||worker.state==='activated'||worker.state==='redundant')resolve();};worker.addEventListener('statechange',finish);finish();});}
   if(reg.waiting){
    status.textContent='新しいバージョンを適用しています…';
    let switched=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!switched){switched=true;location.reload();}},{once:true});
    reg.waiting.postMessage({type:'SKIP_WAITING'});
   }else{
    status.textContent='更新確認が完了しました。画面を再読み込みします。';
    location.reload();
   }
  }catch(error){status.textContent='更新を確認できませんでした。通信状態を確認してください。';}
  finally{button.disabled=false;}
 });
})();
</script><script>
(function(){
 const app=document.getElementById('app');
 const splash=document.getElementById('launchScreen');
 function showTitle(){
   try{sessionStorage.removeItem('umalog-title-seen')}catch(e){}
   if(location.hash==='#home')history.replaceState(null,'',location.pathname+location.search);
   splash.hidden=false;
   splash.style.display='grid';
   window.scrollTo(0,0);
 }
 function ensureButton(){
   if(!app||!app.querySelector('#settingsForm')||app.querySelector('#returnToTitle'))return;
   const card=app.querySelector('#settingsForm').closest('.card');
   if(!card)return;
   const btn=document.createElement('button');
   btn.id='returnToTitle';btn.type='button';btn.className='quiet full';
   btn.textContent='タイトル画面に戻る';
   btn.style.marginBottom='12px';
   card.prepend(btn);
 }
 document.addEventListener('click',event=>{
   if(event.target.closest('#returnToTitle')){event.preventDefault();showTitle();}
 });
 if(app)new MutationObserver(ensureButton).observe(app,{childList:true,subtree:true});
 ensureButton();
})();
</script><script type="module" src="./app.js?v=2520"></script></body></html>
