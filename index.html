<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="うまログ — 日付と金額から簡単に記録できる競馬収支アプリ"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/umalog-app-icon-512.png"><link rel="icon" type="image/png" href="./assets/umalog-app-icon-512.png"><link rel="stylesheet" href="./style.css"><title>うまログ（仮）</title></head><body><section id="launchScreen" class="launch-screen" aria-label="うまログ タイトル画面"><div class="launch-content"><img class="launch-logo" src="./assets/umalog-title-logo.png" alt="うまログ（仮）"><button id="launchStart" class="launch-start" type="button" disabled>はじめる</button><button id="launchUpdate" class="launch-update" type="button" disabled>最新アップデートを確認</button><p id="launchUpdateStatus" class="launch-update-status" role="status" aria-live="polite"></p></div></section><header id="home"><a href="#home" class="brand" aria-label="うまログ（仮） ホーム"><img src="./assets/umalog-title-logo.png" alt="うまログ（仮）" width="76" height="57" style="display:block;width:76px;height:57px;object-fit:contain"></a><button id="settingsButton" class="quiet" aria-label="設定とバックアップ">設定</button></header><div id="update" hidden></div><main id="app"><p>記録を読み込んでいます…</p></main><nav aria-label="メインナビゲーション"><a href="#home"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-8h6v8"/></svg><span>ホーム</span></a><a href="#quick"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="M4 4h16a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 1 2-2Z"/><path d="M12 8v8M8 12h8"/></svg><span>記録</span></a><a href="#history"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h4"/></svg><span>履歴</span></a><a href="#analysis"><svg class="dock-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="M3 20h18M6 17v-5M11 17V7M16 17v-8M21 17V4"/></svg><span>分析</span></a></nav><div id="notice" role="status" aria-live="polite"></div><noscript>JavaScriptを有効にしてください。</noscript><script>
(function(){
 const start=document.getElementById('launchStart');
 const status=document.getElementById('launchUpdateStatus');
 const update=document.getElementById('launchUpdate');
 const flag='umalog-startup-recovery-attempted-v454';
 let recovering=false;
 function show(message){
  if(start&&!start.disabled)return;
  status.textContent=message+' 収支データは削除しません。';
 }
 async function recover(){
  if(recovering)return;
  recovering=true;
  show('古い起動キャッシュを修復しています…');
  try{
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){if(reg.scope.startsWith(new URL('./',location.href).href))await reg.unregister();}
   }
   if('caches' in window){
    const keys=await caches.keys();
    for(const key of keys){if(key.startsWith('umalog-'))await caches.delete(key);}
   }
   location.replace('./index.html?startup=454');
  }catch(e){recovering=false;show('自動修復に失敗しました: '+(e.message||e));}
 }
 function safeGet(key){try{return sessionStorage.getItem(key);}catch{return null;}}
 function safeSet(key,value){try{sessionStorage.setItem(key,value);}catch{}}
 function safeRemove(key){try{sessionStorage.removeItem(key);}catch{}}
 function failed(message){
  if(start&&!start.disabled)return;
  show(message);
  if(!safeGet(flag)){
   safeSet(flag,'1');
   recover();
  }else{
   update.disabled=false;
   update.textContent='起動を修復する';
   update.onclick=recover;
  }
 }
 window.addEventListener('error',e=>failed('起動エラー: '+(e.message||'JavaScriptの読み込みに失敗しました。')));
 window.addEventListener('unhandledrejection',e=>failed('起動エラー: '+(e.reason?.message||'初期化に失敗しました。')));
 setTimeout(()=>{if(start.disabled)failed('起動が完了しません。');else safeRemove(flag);},15000);
 status.textContent='起動準備中…';
})();
</script><script type="module" src="./app.js?v=4510"></script></body></html>
